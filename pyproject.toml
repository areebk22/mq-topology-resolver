[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mqresolver"
version = "0.1.0"
description = "Simplify an enterprise IBM MQ topology: policy-driven target state, complexity score, and before/after graphs"
requires-python = ">=3.10"
dependencies = ["pandas>=2", "networkx>=3", "pydantic>=2", "PyYAML>=6", "openpyxl>=3.1"]

[project.optional-dependencies]
server = ["starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
mqresolver = "mqresolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mqresolver = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: large-estate tests"]
